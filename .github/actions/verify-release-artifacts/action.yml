name: Verify release artifacts
description: >-
  Install and certify the exact built wheel and sdist across every published
  extra, prove the network-denied container journeys, and certify the core
  wheel against a secure etcd quorum. ci.yml (package) and publish.yml (test)
  share these steps verbatim so the release path can never silently drift
  from the CI path.
inputs:
  venv-prefix:
    description: Prefix for the disposable verification virtualenvs.
    required: false
    default: .venv-verify
runs:
  using: composite
  steps:
    - name: Verify the exact wheel in a clean environment
      shell: bash
      env:
        VENV: ${{ inputs.venv-prefix }}
      run: |
        uv venv "$VENV-wheel" --python 3.13
        uv pip install --python "$VENV-wheel/bin/python" dist/*.whl
        uv pip check --python "$VENV-wheel/bin/python"
        "$VENV-wheel/bin/python" -I scripts/smoke_core_install.py

    - name: Prove exact-wheel journeys with OS networking denied
      shell: bash
      run: |
        docker build --file scripts/release-journey.Dockerfile --tag agnoclaw-release-journey .
        docker run --rm --network none --read-only --tmpfs /tmp:rw,nosuid,nodev \
          agnoclaw-release-journey /opt/agnoclaw/public_api_journey_probe.py
        docker run --rm --network none --read-only --tmpfs /tmp:rw,nosuid,nodev \
          agnoclaw-release-journey /opt/agnoclaw/agno_stack_restart_probe.py \
          --allow-process-crash

    - name: Verify the exact source distribution in a clean environment
      shell: bash
      env:
        VENV: ${{ inputs.venv-prefix }}
      run: |
        uv venv "$VENV-sdist" --python 3.13
        uv pip install --python "$VENV-sdist/bin/python" dist/*.tar.gz
        uv pip check --python "$VENV-sdist/bin/python"
        "$VENV-sdist/bin/python" -I scripts/smoke_core_install.py

    - name: Verify the exact wheel with stable MCP v2
      shell: bash
      env:
        VENV: ${{ inputs.venv-prefix }}
      run: |
        uv venv "$VENV-mcp" --python 3.13
        WHEELS=(dist/*.whl)
        uv pip install --python "$VENV-mcp/bin/python" "${WHEELS[0]}[mcp]"
        uv pip check --python "$VENV-mcp/bin/python"
        "$VENV-mcp/bin/python" -I scripts/smoke_core_install.py

    - name: Verify the exact wheel with AgentOS lifecycle dependencies
      shell: bash
      env:
        VENV: ${{ inputs.venv-prefix }}
      run: |
        uv venv "$VENV-server" --python 3.13
        WHEELS=(dist/*.whl)
        uv pip install --python "$VENV-server/bin/python" "${WHEELS[0]}[server]"
        uv pip check --python "$VENV-server/bin/python"
        "$VENV-server/bin/python" -I -c "import multipart; from fastapi import FastAPI; from agnoclaw.runtime.http_lifecycle import build_lifecycle_router; app=FastAPI(); app.include_router(build_lifecycle_router({})); assert '/agnoclaw/v1/harnesses/{harness_id}/runs' in app.openapi()['paths']"

    - name: Verify the exact wheel with OpenTelemetry and OTLP/HTTP dependencies
      shell: bash
      env:
        VENV: ${{ inputs.venv-prefix }}
      run: |
        uv venv "$VENV-otel" --python 3.13
        mapfile -t WHEELS < <(find dist -maxdepth 1 -type f -name '*.whl' -print)
        uv pip install --python "$VENV-otel/bin/python" "${WHEELS[0]}[otel]"
        uv pip check --python "$VENV-otel/bin/python"
        "$VENV-otel/bin/python" -I scripts/smoke_otel_install.py

    - name: Verify the exact wheel with PostgreSQL and service-migration CLI dependencies
      shell: bash
      env:
        VENV: ${{ inputs.venv-prefix }}
      run: |
        uv venv "$VENV-postgres" --python 3.13
        WHEELS=(dist/*.whl)
        uv pip install --python "$VENV-postgres/bin/python" "${WHEELS[0]}[postgres,cli,scheduler]"
        uv pip check --python "$VENV-postgres/bin/python"
        "$VENV-postgres/bin/python" -I -c "from agnoclaw import PostgresRuntimeStore; from agnoclaw.runtime import EtcdGatewayCredentials, EtcdPostgresWriterAuthority, PostgresWriterAuthorityError, PostgresWriterAuthorityGrant, PostgresWriterAuthorityProvider; grant=PostgresWriterAuthorityGrant(authority_id='smoke', server_id='node-a', fence_token=1, remaining_seconds=3); credentials=EtcdGatewayCredentials(endpoint='https://etcd.example:2379', username='reader', password='secret'); assert grant.fence_token == 1 and credentials and PostgresRuntimeStore and EtcdPostgresWriterAuthority and PostgresWriterAuthorityError and PostgresWriterAuthorityProvider"
        "$VENV-postgres/bin/agnoclaw" migrate 0.12 service check --help
        "$VENV-postgres/bin/agnoclaw" migrate 0.12 service preview --help
        "$VENV-postgres/bin/agnoclaw" migrate 0.12 service apply --help
        "$VENV-postgres/bin/agnoclaw" migrate 0.12 service verify --help
        "$VENV-postgres/bin/agnoclaw" migrate 0.12 service cutover --help
        "$VENV-postgres/bin/agnoclaw" migrate 0.12 service rollback --help
        "$VENV-postgres/bin/agnoclaw" inspect run --help

    - name: Certify the exact core wheel against secure etcd quorum
      shell: bash
      env:
        VENV: ${{ inputs.venv-prefix }}
      run: |
        "$VENV-wheel/bin/python" -I scripts/etcd_secure_quorum_probe.py \
          --allow-topology-create \
          --image quay.io/coreos/etcd@sha256:dfd3941bf6ced5fdb700f9b2d98b22b7bca7ceee13aec16224f93ff30d9a59c4 \
          --timeout 90 \
          --lease-ttl 15
