version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      github-actions:
        patterns:
          - "*"

  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      python-runtime:
        patterns:
          - "*"

  # Tracks the digest-pinned release-journey base image. The digest-pinned
  # postgres/etcd images inside workflow run steps are updated manually.
  - package-ecosystem: "docker"
    directory: "/scripts"
    schedule:
      interval: "weekly"
