name: CI

on:
  push:
    branches: [main, "feature/**", "fix/**"]
  pull_request:
    branches: [main]

# Supersede in-flight runs for the same ref (a push burst otherwise stacks
# ~15 Docker-heavy jobs per commit); main keeps every run for release evidence.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

env:
  # Pytest fails before fixtures run if credentials or a live-model test are selected.
  AGNOCLAW_CI_NO_LIVE_LLM: "1"

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install pinned uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: "0.9.15"

      - name: Install dependencies
        run: uv sync --frozen --extra dev --python ${{ matrix.python-version }}

      - name: Run tests with coverage and resource-ownership enforcement
        if: matrix.python-version == '3.13'
        run: uv run pytest tests/ -q -m "not integration" --tb=short --cov=agnoclaw --cov-report=term-missing --cov-fail-under=80

      - name: Prove capability, Agno checkpoint, and approval restart
        if: matrix.python-version == '3.13'
        run: >-
          uv run pytest tests/test_operation_effect_crash_probe.py
          tests/test_agno_tool_checkpoint_restart_probe.py
          tests/test_agno_approval_restart_probe.py
          -q -m integration --tb=short

      - name: Run tests with resource-ownership enforcement
        if: matrix.python-version != '3.13'
        run: uv run pytest tests/ -q -m "not integration" --tb=short

  agno-compatibility:
    name: Agno ${{ matrix.agno-version }} contracts
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        agno-version: ["2.6.4", "2.9.0"]

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"

      - name: Install pinned uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: "0.9.15"

      - name: Run warning-clean contracts in an isolated dependency lane
        run: >-
          uv run --isolated --with-editable '.[dev,server]'
          --with 'agno==${{ matrix.agno-version }}'
          pytest tests/ -q -m 'not integration' --tb=short

      - name: Prove factory-backed outer and learning process restart
        run: >-
          uv run --isolated --with-editable '.[dev]'
          --with 'agno==${{ matrix.agno-version }}'
          pytest tests/test_agno_stack_restart_probe.py
          tests/test_learning_reconciliation_restart_probe.py
          -q -m integration --tb=short

  agno-preview:
    name: Agno 3 preview (quarantined)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    continue-on-error: true

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"

      - name: Install pinned uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: "0.9.15"

      - name: Create preview environment
        run: uv venv .venv-preview --python 3.13

      - name: Install with explicit prerelease override
        run: >-
          uv pip install --python .venv-preview/bin/python
          --overrides .github/requirements/agno3-preview.txt
          -e '.[dev]'

      - name: Run warning-clean preview contract suite
        run: .venv-preview/bin/python -m pytest tests/ -q -m "not integration" --tb=short

  agentos-edge:
    name: AgentOS edge / FastAPI ${{ matrix.fastapi-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        fastapi-version: ["0.136.3", "0.141.1"]

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"

      - name: Install pinned uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: "0.9.15"

      - name: Run authenticated lifecycle and compatibility contracts
        run: >-
          uv run --isolated --with-editable '.[dev,server]'
          --with 'fastapi==${{ matrix.fastapi-version }}'
          pytest tests/test_http_lifecycle.py tests/test_agentos_adapter.py
          tests/test_remote.py -q --tb=short

  mcp-compatibility:
    name: MCP 2026-07-28 / Python SDK v2 contracts
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"

      - name: Install pinned uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: "0.9.15"

      - name: Install the locked MCP extra
        run: uv sync --frozen --extra dev --extra mcp --python 3.13

      - name: Run real SDK and deferred-ingress contracts
        run: uv run pytest tests/test_mcp.py -q --tb=short

  dependency-audit:
    name: Locked dependency vulnerability audit
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"

      - name: Install pinned uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: "0.9.15"

      - name: Install the locked audit toolchain
        run: uv sync --frozen --extra dev --python 3.13

      - name: Export every locked optional dependency set
        run: >-
          uv export --all-extras --frozen --no-hashes --no-emit-project
          --output-file /tmp/agnoclaw-security-audit-requirements.txt
          > /dev/null

      - name: Reject known vulnerable locked dependencies
        run: >-
          uv run --no-sync pip-audit --strict --no-deps --disable-pip
          --progress-spinner off
          --requirement /tmp/agnoclaw-security-audit-requirements.txt

  postgres-runtime-store:
    name: PostgreSQL RuntimeStore contracts
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:17-alpine@sha256:18cfe3ef5e6815560c98237d6216d1e5119702fb0f3894c8785dd58b8bbe5d73
        env:
          POSTGRES_PASSWORD: agnoclaw_test_only
          POSTGRES_DB: agnoclaw_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d agnoclaw_test"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 20

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"

      - name: Install pinned uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: "0.9.15"

      - name: Install PostgreSQL test dependencies
        run: uv sync --frozen --extra dev --extra postgres --python 3.13

      - name: Run warning-clean real-service store contracts
        env:
          AGNOCLAW_TEST_POSTGRES_URL: >-
            postgresql://postgres:agnoclaw_test_only@127.0.0.1:5432/agnoclaw_test
        run: >-
          uv run pytest tests/test_postgres_runtime_store.py
          tests/test_postgres_learning_ledger.py
          tests/test_operation_race_matrix.py
          tests/test_migration_service_apply.py
          tests/test_migration_service_production_matrix.py
          tests/test_migration_service_scan.py
          tests/test_migration_service_transform.py
          tests/test_migration_service_cli.py -q --tb=short

      - name: Run bounded PostgreSQL load and isolation gate
        run: >-
          uv run python scripts/benchmark_postgres_runtime.py
          --dsn postgresql://postgres:agnoclaw_test_only@127.0.0.1:5432/agnoclaw_test
          --max-p95-slowdown-ratio 6

      - name: Measure bounded learning evaluation archive performance (advisory)
        id: archive-benchmark
        continue-on-error: true
        run: >-
          uv run python scripts/benchmark_learning_evaluation_archive.py
          --dsn postgresql://postgres:agnoclaw_test_only@127.0.0.1:5432/agnoclaw_test
          --max-p99-ms 150

      - name: Surface the advisory archive measurement outcome
        if: steps.archive-benchmark.outcome == 'failure'
        run: |
          echo "::warning::Advisory learning-evaluation archive benchmark exceeded its target in this run"
          echo "⚠️ Advisory gate failed: learning-evaluation archive benchmark (p99/slowdown target missed)" >> "$GITHUB_STEP_SUMMARY"

      - name: Resolve the exact PostgreSQL service container
        shell: bash
        run: |
          mapfile -t containers < <(docker ps --filter publish=5432 --format '{{.ID}}')
          if [[ "${#containers[@]}" -ne 1 ]]; then
            echo "expected exactly one container publishing PostgreSQL port 5432" >&2
            exit 1
          fi
          echo "AGNOCLAW_POSTGRES_TEST_CONTAINER=${containers[0]}" >> "$GITHUB_ENV"

      - name: Rehearse exact PostgreSQL backup and restore
        run: >-
          uv run python scripts/postgres_backup_restore_probe.py
          --source-dsn postgresql://postgres:agnoclaw_test_only@127.0.0.1:5432/agnoclaw_test
          --target-dsn postgresql://postgres:agnoclaw_test_only@127.0.0.1:5432/agnoclaw_restore_test
          --container "${AGNOCLAW_POSTGRES_TEST_CONTAINER}"
          --allow-target-reset

      - name: Prove bounded PostgreSQL outage and pool recovery
        run: >-
          uv run python scripts/postgres_restart_probe.py
          --dsn postgresql://postgres:agnoclaw_test_only@127.0.0.1:5432/agnoclaw_test
          --container "${AGNOCLAW_POSTGRES_TEST_CONTAINER}"

  postgres-fenced-promotion:
    name: PostgreSQL HA recovery resilience
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"

      - name: Install pinned uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: "0.9.15"

      - name: Install PostgreSQL test dependencies
        run: uv sync --frozen --extra dev --extra postgres --python 3.13

      - name: Run pure topology authority contracts
        run: >-
          uv run pytest tests/test_postgres_failover_probe.py
          tests/test_postgres_synchronous_failover_probe.py
          tests/test_postgres_role_rotation_probe.py
          tests/test_postgres_writer_authority.py
          tests/test_postgres_writer_authority_etcd.py
          tests/test_etcd_writer_authority_probe.py
          tests/test_etcd_secure_quorum_probe.py
          tests/test_postgres_split_brain_authority_probe.py -q --tb=short

      - name: Prove live etcd authority revision, revocation, expiry, and loss
        run: >-
          uv run python scripts/etcd_writer_authority_probe.py
          --allow-container-create
          --image quay.io/coreos/etcd@sha256:dfd3941bf6ced5fdb700f9b2d98b22b7bca7ceee13aec16224f93ff30d9a59c4
          --timeout 60
          --lease-ttl 3

      - name: Prove mTLS, exact-key RBAC, quorum loss, and fenced recovery
        run: >-
          uv run python scripts/etcd_secure_quorum_probe.py
          --allow-topology-create
          --image quay.io/coreos/etcd@sha256:dfd3941bf6ced5fdb700f9b2d98b22b7bca7ceee13aec16224f93ff30d9a59c4
          --timeout 90
          --lease-ttl 15

      - name: Prove runtime and learning replica lag, fenced promotion, and reattachment
        run: >-
          uv run python scripts/postgres_failover_probe.py
          --allow-topology-create
          --image postgres@sha256:18cfe3ef5e6815560c98237d6216d1e5119702fb0f3894c8785dd58b8bbe5d73
          --timeout 90
          --outage-timeout 1

      - name: Exercise remote-apply acknowledgement and abrupt-loss recovery (advisory)
        id: abrupt-loss-drill
        continue-on-error: true
        run: >-
          uv run python scripts/postgres_synchronous_failover_probe.py
          --allow-topology-create
          --image postgres@sha256:18cfe3ef5e6815560c98237d6216d1e5119702fb0f3894c8785dd58b8bbe5d73
          --timeout 30
          --outage-timeout 1
          --blocked-observation 0.5

      - name: Surface the advisory abrupt-loss drill outcome
        if: steps.abrupt-loss-drill.outcome == 'failure'
        run: |
          echo "::warning::Advisory remote-apply abrupt-loss container drill failed in this run"
          echo "⚠️ Advisory gate failed: remote-apply abrupt-loss recovery drill" >> "$GITHUB_STEP_SUMMARY"

      - name: Prove old-primary rejoin and round-trip role rotation
        run: >-
          uv run python scripts/postgres_role_rotation_probe.py
          --allow-topology-create
          --image postgres@sha256:18cfe3ef5e6815560c98237d6216d1e5119702fb0f3894c8785dd58b8bbe5d73
          --timeout 90
          --outage-timeout 1

      - name: Prove application-level containment of two writable timelines
        run: >-
          uv run python scripts/postgres_split_brain_authority_probe.py
          --allow-topology-create
          --image postgres@sha256:18cfe3ef5e6815560c98237d6216d1e5119702fb0f3894c8785dd58b8bbe5d73
          --etcd-image quay.io/coreos/etcd@sha256:dfd3941bf6ced5fdb700f9b2d98b22b7bca7ceee13aec16224f93ff30d9a59c4
          --timeout 90
          --outage-timeout 1

  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"

      - name: Install pinned uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: "0.9.15"

      - name: Install dependencies
        run: uv sync --frozen --extra dev --python 3.13

      - name: Run ruff (lint)
        run: uv run ruff check src/ tests/ scripts/

      - name: Run mypy
        run: uv run mypy src/agnoclaw/ --ignore-missing-imports

      - name: Check generated API reference
        run: uv run python scripts/generate_api_reference.py --check

  package:
    name: Wheel, sdist, and lean-core budgets
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"

      - name: Install pinned uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: "0.9.15"

      - name: Install development environment
        run: uv sync --frozen --extra dev --python 3.13

      - name: Build wheel and source distribution
        run: uv build --clear

      - name: Enforce package and import budgets
        run: uv run python scripts/check_package_budget.py --artifacts dist

      - name: Validate package metadata
        run: uv run twine check dist/*

      - name: Verify the exact release artifacts
        uses: ./.github/actions/verify-release-artifacts
        with:
          venv-prefix: .venv-verify

      - name: Smoke-test the default provider extra
        run: |
          # Install the built wheel by path: a bare requirement with
          # --find-links may resolve the already-published PyPI release of the
          # same version instead of the artifact under test.
          WHEELS=(dist/*.whl)
          uv pip install --python .venv-verify-wheel/bin/python "${WHEELS[0]}[anthropic]"
          AGNOCLAW_STORAGE__SQLITE_PATH=.venv-verify-wheel/provider-smoke.db \
            .venv-verify-wheel/bin/python -I -c \
            "from agnoclaw import AgentHarness; h=AgentHarness(include_default_tools=False); assert h; h.close()"
