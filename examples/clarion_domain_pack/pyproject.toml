[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agnoclaw-clarion-example"
version = "0.1.0"
description = "Example authoring package for a Clarion-shaped domain"
requires-python = ">=3.11"
dependencies = ["agnoclaw>=0.15,<0.16", "pydantic>=2"]

[tool.hatch.build.targets.wheel]
packages = ["clarion_domain"]

[tool.hatch.build.targets.wheel.force-include]
"skills" = "clarion_domain/resources/skills"
