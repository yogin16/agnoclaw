[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agnoclaw"
version = "0.12.1"
description = "A hackable, model-agnostic agent harness built on Agno — with Claude Code's prompt wisdom, OpenClaw's UX patterns, and full Python extensibility"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11,<3.15"
authors = [{ name = "agnoclaw contributors" }]
keywords = ["ai", "agents", "llm", "harness", "agno", "claude", "autonomous"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    # Core framework
    # Stable production range is contract-tested at the legacy, v2-primary,
    # and v3-primary boundaries in CI.
    "agno>=2.6.4,<3.1",
    # Config
    # tomli not needed — Python 3.11+ has tomllib in stdlib
    "pydantic>=2.0.0",
    "pydantic-settings>=2.14.2",
    # SKILL.md frontmatter. Declared directly even though Agno currently carries it:
    # agnoclaw imports yaml and does not rely on a transitive dependency contract.
    "pyyaml>=6.0.0",
    # Remote client and built-in HTTP fetch. Agno also uses httpx, but this is a
    # direct agnoclaw dependency and remains explicit.
    "httpx>=0.27.0",
    # AgentHarness defaults to Agno's SQLiteDb, whose public backend imports
    # SQLAlchemy. Core construction must work without a storage extra.
    "sqlalchemy>=2.0.0",
]

[project.optional-dependencies]
# Provider-neutral core: install only the model SDKs an embedding actually uses.
anthropic = [
    "anthropic>=0.83.0",
]
openai = [
    "openai>=2.0.0",
]
google = [
    "google-genai>=1.52.0",
]
groq = [
    "groq>=0.11.0",
]
# Rich HTML extraction and keyless search fallback. HTTP fetch remains in core.
web = [
    "beautifulsoup4>=4.12.0",
    "ddgs>=9.0.0,<10",
]
# Cron expressions for the embedded heartbeat scheduler. Interval schedules need no
# extra. APScheduler was removed because agnoclaw does not import or use it.
scheduler = [
    "croniter>=1.3.0",
]
# Basic CLI (Click REPL + Rich output)
cli = [
    "click>=8.3.3",
    "rich>=13.0.0",
    "prompt-toolkit>=3.0.0",
]
# Full Textual TUI (textual brings rich transitively)
tui = [
    "textual>=0.85.0",
    "click>=8.3.3",
    "prompt-toolkit>=3.0.0",
]
# Recommended batteries-included personal-assistant setup.
full = [
    "agnoclaw[anthropic,scheduler,tui,web]",
]
postgres = [
    "psycopg[binary,pool]>=3.2.0",
]
# Optional OpenTelemetry SDK and OTLP/HTTP exporter. The core bridge remains
# dependency-free and never configures process-global providers or endpoints.
otel = [
    "opentelemetry-api>=1.44.0,<2",
    "opentelemetry-sdk>=1.44.0,<2",
    "opentelemetry-exporter-otlp-proto-http>=1.44.0,<2",
]
# Local / offline models via Ollama (no API key required)
# Install: uv sync --extra local
# Requires Ollama daemon running: https://ollama.com
local = [
    "ollama>=0.6.1",
    "openai>=2.0.0",  # Agno's Ollama transport uses openai's HTTP client
]
all-models = [
    "anthropic>=0.83.0",
    "openai>=2.0.0",
    "ollama>=0.6.1",
    "google-genai>=1.52.0",
    "groq>=0.11.0",
]
# Browser automation (Playwright)
browser = [
    "playwright>=1.40.0",
]
# Docker-first llm-sandbox runtime integration
llm-sandbox = [
    "llm-sandbox[docker]>=0.3.31",
]
# MCP (Model Context Protocol) server integration
mcp = [
    "mcp>=2.0.0,<3",
]
# Optional AgentOS/FastAPI server export.
server = [
    "fastapi>=0.115.0",
    "python-multipart>=0.0.31",
    "uvicorn>=0.30.0",
]
# Media tools (PDF, images)
media = [
    "pymupdf>=1.23.0",
]
# RAG (Retrieval-Augmented Generation) examples
rag = [
    "lancedb>=0.4.0",
    "tantivy>=0.22.0",
    "pymupdf>=1.23.0",
]
# Notebook tools
notebook = [
    "nbformat>=5.9.0",
]
dev = [
    "pip-audit==2.10.1",
    "pytest>=9.0.3",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.6.0",
    "mypy>=1.11.0",
    "twine>=6.0.0",
    "types-croniter>=1.3.2",
    "types-PyYAML>=6.0.12",
    "textual-dev>=1.0.0",
    "anthropic>=0.83.0",  # prompt-cache and provider materialization contracts
    "beautifulsoup4>=4.12.0",  # rich web extraction contracts
    "ddgs>=9.0.0,<10",  # keyless web-search contracts
    "croniter>=1.3.0",  # scheduler expression contracts
    "openai>=2.0.0",    # Agno uses openai as transport; needed by team model resolution tests
    "nbformat>=5.9.0",  # needed by notebook toolkit tests
]

[project.scripts]
agnoclaw = "agnoclaw.cli.bootstrap:main"

[project.urls]
Homepage = "https://github.com/yogin16/agnoclaw"
Documentation = "https://github.com/yogin16/agnoclaw#readme"
Repository = "https://github.com/yogin16/agnoclaw"
Issues = "https://github.com/yogin16/agnoclaw/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/agnoclaw"]

[tool.hatch.build.targets.wheel.shared-data]
"skills" = "share/agnoclaw/skills"

[tool.ruff]
src = ["src"]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]

[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true
check_untyped_defs = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
filterwarnings = [
    "error::ResourceWarning",
    "error::pytest.PytestUnraisableExceptionWarning",
    "error::DeprecationWarning",
    "error::FutureWarning",
]

[tool.coverage.run]
source = ["src/agnoclaw"]
omit = [
    "*/cli/*",     # CLI tested via Click test runner, not coverage
    "*/tui/*",     # TUI requires Textual display, tested separately
    # Optional service adapters run in dedicated dependency/PostgreSQL CI lanes. The
    # core unit threshold must not count modules that its environment cannot exercise.
    "*/runtime/http_lifecycle.py",
    "*/runtime/postgres_store.py",
    "*/learning_postgres.py",
    "*/__init__.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "\\.\\.\\.",
]
show_missing = true
